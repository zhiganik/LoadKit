name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Format
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        run: dotnet test --no-build

      - name: Validate sample scenarios
        run: |
          for scenario in samples/scenarios/*.json; do
            dotnet run --project src/LoadKit.Cli --no-build -- validate "$scenario" --env-file samples/scenarios/.env.example
          done
